<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatRoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070204;
      --panel: #0f0508;
      --panel-2: #170709;
      --border: #3a1018;
      --border-hot: #ff2a45;
      --text: #fbeef0;
      --text-dim: #a47a82;
      --accent: #ff1f3d;
      --accent-2: #ff5c70;
      --accent-deep: #8f0a1e;
      --danger: #ff1f3d;
      --off: #5b4a4e;
      --font-display: "Orbitron", "Segoe UI", system-ui, sans-serif;
      --font-body: "Rajdhani", "Segoe UI", system-ui, sans-serif;
      --cut: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 16px;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 31, 61, 0.18), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(143, 10, 30, 0.35), transparent 50%),
        var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* rejilla tecnológica de fondo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 31, 61, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 31, 61, 0.09) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      pointer-events: none;
    }

    /* líneas de escaneo muy sutiles */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* esquinas tipo HUD reutilizables */
    .hud {
      position: relative;
    }

    .hud::before,
    .hud::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid var(--border-hot);
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(255, 31, 61, 0.8));
    }

    .hud::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }

    .hud::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }

    /* ---------- LOGIN ---------- */
    #login-screen {
      background: linear-gradient(160deg, rgba(23, 7, 9, 0.92), rgba(10, 3, 5, 0.96));
      border: 1px solid var(--border);
      padding: 44px 38px 36px;
      width: 380px;
      max-width: 92vw;
      box-shadow:
        0 0 0 1px rgba(255, 31, 61, 0.08),
        0 0 60px rgba(255, 31, 61, 0.22),
        0 30px 80px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: boot 0.7s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes boot {
      0% { opacity: 0; transform: scaleY(0.04); filter: brightness(3); }
      60% { opacity: 1; transform: scaleY(1.02); filter: brightness(1.6); }
      100% { opacity: 1; transform: scaleY(1); filter: brightness(1); }
    }

    #login-screen h1 {
      margin: 0 0 10px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 34px;
      letter-spacing: 0.14em;
      color: var(--text);
      text-shadow:
        0 0 8px rgba(255, 31, 61, 0.9),
        0 0 28px rgba(255, 31, 61, 0.65),
        2px 0 0 rgba(255, 31, 61, 0.5),
        -2px 0 0 rgba(0, 0, 0, 0.6);
    }

    #login-screen p {
      margin: 0 0 28px;
      color: var(--text-dim);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .field {
      text-align: left;
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 7px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-deep);
      background: rgba(0, 0, 0, 0.45);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }

    input[type="text"]::placeholder { color: #6a4a51; }

    input[type="text"]:focus {
      border-color: var(--accent);
      border-left-color: var(--accent);
      box-shadow: inset 0 0 18px rgba(255, 31, 61, 0.18);
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    #join-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent));
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 10px;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      transition: filter 0.15s, transform 0.1s;
      box-shadow: 0 0 24px rgba(255, 31, 61, 0.5);
    }

    #join-btn:hover { filter: brightness(1.25) drop-shadow(0 0 10px rgba(255, 31, 61, 0.9)); }
    #join-btn:active { transform: scale(0.98); }

    #login-error {
      color: var(--accent-2);
      font-size: 14px;
      font-weight: 600;
      min-height: 18px;
      margin-top: 12px;
    }

    /* ---------- CHAT ---------- */
    #chat-screen {
      display: none;
      width: 960px;
      max-width: 96vw;
      height: 660px;
      max-height: 92vh;
      background: linear-gradient(160deg, rgba(15, 5, 8, 0.95), rgba(7, 2, 4, 0.98));
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(255, 31, 61, 0.08),
        0 0 70px rgba(255, 31, 61, 0.2),
        0 30px 80px rgba(0, 0, 0, 0.6);
      animation: boot 0.6s cubic-bezier(.2, .8, .2, 1) both;
    }

    #chat-layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      height: 100%;
    }

    /* sidebar */
    #sidebar {
      background: linear-gradient(180deg, rgba(143, 10, 30, 0.22), rgba(23, 7, 9, 0.9) 40%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      min-height: 0;
    }

    #sidebar .room-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      word-break: break-word;
      color: var(--text);
      text-shadow: 0 0 12px rgba(255, 31, 61, 0.7);
    }

    #sidebar .room-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar .section-title {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent-2);
      margin-bottom: 10px;
    }

    #user-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }

    #user-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0 7px 10px;
      font-size: 15px;
      font-weight: 600;
      border-left: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-2);
      flex-shrink: 0;
      transform: rotate(45deg);
      box-shadow: 0 0 8px var(--accent);
    }

    #leave-btn {
      margin-top: 14px;
      background: transparent;
      color: var(--accent-2);
      border: 1px solid var(--accent-deep);
      padding: 10px;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      transition: background 0.15s, color 0.15s;
    }

    #leave-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    /* main chat */
    #main-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(255, 31, 61, 0.12), transparent 60%);
    }

    #chat-header .title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    #conn-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: var(--accent-deep); }
    #messages::-webkit-scrollbar-track { background: transparent; }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }

    .msg-row.own { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.35;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg-row.own .msg-bubble {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      color: #fff;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
      box-shadow: 0 0 20px rgba(255, 31, 61, 0.4);
    }

    .msg-row.other .msg-bubble {
      background: linear-gradient(90deg, rgba(255, 31, 61, 0.14), rgba(23, 7, 9, 0.95) 30%);
      border-left: 3px solid var(--accent);
      clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px);
    }

    .system-msg {
      align-self: center;
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    #typing-indicator {
      height: 20px;
      padding: 0 22px 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-2);
    }

    /* media bubbles */
    .msg-bubble img.msg-image {
      display: block;
      max-width: 220px;
      max-height: 260px;
      cursor: pointer;
      object-fit: cover;
      border: 1px solid var(--accent-deep);
    }

    .msg-bubble audio.msg-audio {
      max-width: 230px;
      height: 36px;
    }

    .msg-caption {
      margin-top: 6px;
    }

    /* image lightbox */
    #image-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 1, 3, 0.94);
      z-index: 200;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    #image-lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border: 1px solid var(--accent);
      box-shadow: 0 0 60px rgba(255, 31, 61, 0.45);
    }

    #message-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      position: relative;
    }

    #message-input {
      flex: 1;
    }

    .toolbar-btn {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .toolbar-btn:hover {
      border-color: var(--accent);
      box-shadow: inset 0 0 14px rgba(255, 31, 61, 0.35);
    }

    .toolbar-btn.recording {
      background: #fff;
      border-color: #fff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #recording-indicator {
      display: none;
      align-items: center;
      gap: 10px;
      flex: 1;
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-2);
    }

    #recording-indicator .rec-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1s infinite;
    }

    #emoji-panel {
      display: none;
      position: absolute;
      bottom: 66px;
      left: 22px;
      width: 290px;
      max-height: 220px;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--accent-deep);
      padding: 10px;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      box-shadow: 0 0 30px rgba(255, 31, 61, 0.25), 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    #emoji-panel button {
      background: transparent;
      font-size: 19px;
      padding: 4px;
      line-height: 1;
    }

    #emoji-panel button:hover { background: var(--accent-deep); }

    #send-btn {
      background: linear-gradient(90deg, var(--accent-deep), var(--accent));
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0 22px;
      height: 40px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      box-shadow: 0 0 20px rgba(255, 31, 61, 0.5);
      transition: filter 0.15s;
    }

    #send-btn:hover { filter: brightness(1.25); }

    @media (max-width: 640px) {
      #chat-layout { grid-template-columns: 1fr; }
      #sidebar { display: none; }
      #emoji-panel { left: 10px; width: 240px; grid-template-columns: repeat(6, 1fr); }
      #login-screen { padding: 36px 24px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #login-screen,
      #chat-screen,
      .toolbar-btn.recording,
      #recording-indicator .rec-dot { animation: none; }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login-screen" class="hud">
    <h1>CHATROOM</h1>
    <p>Entra a una sala y conversa en tiempo real</p>
    <form id="login-form">
      <div class="field">
        <label for="username-input">Tu nombre</label>
        <input id="username-input" type="text" autocomplete="off" maxlength="20" placeholder="Ej. Felipe" required />
      </div>
      <div class="field">
        <label for="room-input">Sala</label>
        <input id="room-input" type="text" autocomplete="off" maxlength="30" placeholder="Ej. general" required />
      </div>
      <button id="join-btn" type="submit">Entrar al chat</button>
      <div id="login-error"></div>
    </form>
  </div>

  <!-- CHAT -->
  <div id="chat-screen" class="hud">
    <div id="chat-layout">
      <aside id="sidebar">
        <div class="room-name" id="sidebar-room-name">#sala</div>
        <div class="room-sub" id="sidebar-username-sub">conectado como ...</div>
        <div class="section-title">En línea</div>
        <ul id="user-list"></ul>
        <button id="leave-btn" type="button">Salir de la sala</button>
      </aside>

      <div id="main-panel">
        <div id="chat-header">
          <div class="title" id="header-room-title">#sala</div>
          <div id="conn-status">
            <span class="status-dot" id="conn-dot"></span>
            <span id="conn-text">conectando...</span>
          </div>
        </div>

        <div id="messages"></div>
        <div id="typing-indicator"></div>

        <form id="message-form">
          <div id="emoji-panel"></div>

          <button class="toolbar-btn" id="emoji-btn" type="button" title="Emojis">😊</button>
          <button class="toolbar-btn" id="photo-btn" type="button" title="Enviar foto">📷</button>
          <button class="toolbar-btn" id="mic-btn" type="button" title="Grabar audio">🎤</button>
          <input id="photo-input" type="file" accept="image/*" hidden />

          <input id="message-input" type="text" autocomplete="off" placeholder="Escribe un mensaje..." />

          <div id="recording-indicator">
            <span class="rec-dot"></span>
            <span id="recording-time">0:00</span>
            <span>grabando...</span>
          </div>

          <button id="send-btn" type="submit">Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <div id="image-lightbox">
    <img id="lightbox-img" src="" alt="imagen ampliada" />
  </div>

  <script src="https://clase-corte-2.onrender.com/socket.io/socket.io.js"></script>
  <script>
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username-input');
    const roomInput = document.getElementById('room-input');
    const loginError = document.getElementById('login-error');

    const sidebarRoomName = document.getElementById('sidebar-room-name');
    const sidebarUsernameSub = document.getElementById('sidebar-username-sub');
    const headerRoomTitle = document.getElementById('header-room-title');
    const userList = document.getElementById('user-list');
    const leaveBtn = document.getElementById('leave-btn');

    const connDot = document.getElementById('conn-dot');
    const connText = document.getElementById('conn-text');

    const messagesEl = document.getElementById('messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');

    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPanel = document.getElementById('emoji-panel');
    const photoBtn = document.getElementById('photo-btn');
    const photoInput = document.getElementById('photo-input');
    const micBtn = document.getElementById('mic-btn');
    const recordingIndicator = document.getElementById('recording-indicator');
    const recordingTime = document.getElementById('recording-time');
    const imageLightbox = document.getElementById('image-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    let socket = null;
    let username = '';
    let room = '';
    let typingTimeout = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStartTime = 0;
    let recordingTimerId = null;

    const EMOJIS = [
      '😀','😁','😂','🤣','😊','😍','😘','😜','🤔','😎',
      '😢','😭','😡','🥳','😴','🤯','😱','🤗','🙄','😇',
      '👍','👎','👏','🙌','🙏','💪','👋','🤝','✌️','🤞',
      '❤️','💔','💯','🔥','✨','🎉','🎂','⭐','☀️','🌙',
      '🐶','🐱','🍕','🍔','🍺','☕','⚽','🎮','📚','💻'
    ];

    function buildEmojiPanel() {
      emojiPanel.innerHTML = '';
      EMOJIS.forEach((emoji) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = emoji;
        btn.addEventListener('click', () => {
          messageInput.value += emoji;
          messageInput.focus();
        });
        emojiPanel.appendChild(btn);
      });
    }
    buildEmojiPanel();

    emojiBtn.addEventListener('click', () => {
      emojiPanel.style.display = emojiPanel.style.display === 'grid' ? 'none' : 'grid';
    });

    document.addEventListener('click', (e) => {
      if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) {
        emojiPanel.style.display = 'none';
      }
    });

    imageLightbox.addEventListener('click', () => {
      imageLightbox.style.display = 'none';
      lightboxImg.src = '';
    });

    function resizeImageToDataUrl(file, maxWidth = 900, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    photoBtn.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      photoInput.value = '';
      if (!file || !socket) return;

      try {
        const dataUrl = await resizeImageToDataUrl(file);
        socket.emit('message', {
          room,
          username,
          type: 'image',
          mediaData: dataUrl,
          message: messageInput.value.trim(),
        });
        messageInput.value = '';
      } catch (err) {
        console.error('No se pudo procesar la imagen', err);
      }
    });

    async function toggleRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          clearInterval(recordingTimerId);
          recordingIndicator.style.display = 'none';
          micBtn.classList.remove('recording');

          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = () => {
            if (!socket) return;
            socket.emit('message', {
              room,
              username,
              type: 'audio',
              mediaData: reader.result,
              message: '',
            });
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        micBtn.classList.add('recording');
        recordingIndicator.style.display = 'flex';
        recordingStartTime = Date.now();
        recordingTimerId = setInterval(() => {
          const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
          const m = Math.floor(secs / 60);
          const s = String(secs % 60).padStart(2, '0');
          recordingTime.textContent = `${m}:${s}`;
          if (secs >= 60) mediaRecorder.stop(); // límite de 60s
        }, 250);
      } catch (err) {
        console.error('No se pudo acceder al micrófono', err);
        alert('No se pudo acceder al micrófono. Revisa los permisos del navegador.');
      }
    }

    micBtn.addEventListener('click', toggleRecording);

    // recordar nombre/sala anteriores
    usernameInput.value = localStorage.getItem('chat-username') || '';
    roomInput.value = localStorage.getItem('chat-room') || '';

    // colores de usuario dentro de la gama roja / ámbar / magenta para mantener el tema
    function hashColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const h = Math.abs(hash);
      const hue = ((h % 90) + 335) % 360; // 335° (magenta-rojo) → 65° (ámbar)
      const light = 60 + (h % 3) * 6;
      return `hsl(${hue}, 95%, ${light}%)`;
    }

    function formatTime(dateInput) {
      const d = new Date(dateInput);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessage(doc) {
      const isOwn = doc.username === username;
      const row = document.createElement('div');
      row.className = `msg-row ${isOwn ? 'own' : 'other'}`;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.style.color = isOwn ? 'var(--text-dim)' : hashColor(doc.username);
      meta.textContent = `${isOwn ? 'Tú' : doc.username} · ${formatTime(doc.createdAt)}`;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (doc.type === 'image' && doc.mediaData) {
        const img = document.createElement('img');
        img.className = 'msg-image';
        img.src = doc.mediaData;
        img.addEventListener('click', () => {
          lightboxImg.src = doc.mediaData;
          imageLightbox.style.display = 'flex';
        });
        bubble.appendChild(img);

        if (doc.message) {
          const caption = document.createElement('div');
          caption.className = 'msg-caption';
          caption.textContent = doc.message;
          bubble.appendChild(caption);
        }
      } else if (doc.type === 'audio' && doc.mediaData) {
        const audio = document.createElement('audio');
        audio.className = 'msg-audio';
        audio.src = doc.mediaData;
        audio.controls = true;
        bubble.appendChild(audio);
      } else {
        bubble.textContent = doc.message;
      }

      row.appendChild(meta);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function renderSystemMessage(text) {
      const el = document.createElement('div');
      el.className = 'system-msg';
      el.textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function renderUserList(users) {
      userList.innerHTML = '';
      users.forEach((u) => {
        const li = document.createElement('li');
        const dot = document.createElement('span');
        dot.className = 'status-dot';
        const name = document.createElement('span');
        name.textContent = u;
        li.appendChild(dot);
        li.appendChild(name);
        userList.appendChild(li);
      });
    }

    function setConnectionStatus(connected) {
      connDot.style.background = connected ? 'var(--accent-2)' : 'var(--off)';
      connDot.style.boxShadow = connected ? '0 0 8px var(--accent)' : 'none';
      connText.textContent = connected ? 'conectado' : 'desconectado';
    }

    function joinChat(name, roomName) {
      username = name.trim();
      room = roomName.trim();

      localStorage.setItem('chat-username', username);
      localStorage.setItem('chat-room', room);

      sidebarRoomName.textContent = `#${room}`;
      headerRoomTitle.textContent = `#${room}`;
      sidebarUsernameSub.textContent = `conectado como ${username}`;

      loginScreen.style.display = 'none';
      chatScreen.style.display = 'block';
      messagesEl.innerHTML = '';

      socket = io();

      socket.on('connect', () => {
        setConnectionStatus(true);
        socket.emit('join-room', { room, username });
      });

      socket.on('disconnect', () => setConnectionStatus(false));

      socket.on('room-history', (history) => {
        messagesEl.innerHTML = '';
        history.forEach(renderMessage);
      });

      socket.on('messages', renderMessage);
      socket.on('system-message', renderSystemMessage);
      socket.on('online-users', renderUserList);

      socket.on('typing', (who) => {
        typingIndicator.textContent = `${who} está escribiendo...`;
      });

      socket.on('stop-typing', () => {
        typingIndicator.textContent = '';
      });

      messageInput.focus();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = usernameInput.value.trim();
      const roomName = roomInput.value.trim();

      if (!name || !roomName) {
        loginError.textContent = 'Completa tu nombre y la sala.';
        return;
      }
      loginError.textContent = '';
      joinChat(name, roomName);
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !socket) return;

      socket.emit('message', { room, username, type: 'text', message: text });
      socket.emit('stop-typing', { room });
      messageInput.value = '';
      clearTimeout(typingTimeout);
    });

    messageInput.addEventListener('input', () => {
      if (!socket) return;
      socket.emit('typing', { room, username });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop-typing', { room });
      }, 1200);
    });

    leaveBtn.addEventListener('click', () => {
      if (socket) socket.disconnect();
      chatScreen.style.display = 'none';
      loginScreen.style.display = 'block';
      typingIndicator.textContent = '';
      userList.innerHTML = '';
    });
  </script>
</body>

</html>
